<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="cf-theme.css">
</helmet>
<section style="background:#fff;border-radius:22px;box-shadow:var(--shadow-sm);padding:16px 18px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-body);color:var(--color-text)">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px">
    <sc-if value="{{ hasHead }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0"><span style="font-weight:800;font-size:18px">{{ head }}</span><span style="font-size:12px;color:var(--color-neutral-700)">{{ headSub }}</span></div></sc-if>
    <div class="cf-rail" style="display:flex;gap:2px;padding:3px;background:var(--color-neutral-200);border-radius:999px;width:fit-content;margin-left:auto">
      <sc-for list="{{ ranges }}" as="r" hint-placeholder-count="4"><button onClick="{{ r.pick }}" style="font:inherit;font-size:12px;font-weight:800;padding:6px 12px;min-height:32px;border:0;border-radius:999px;background:{{ r.bg }};color:{{ r.fg }};cursor:pointer">{{ r.label }}</button></sc-for>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:16px;background:var(--color-neutral-100)">
    <sc-for list="{{ chipGroups }}" as="cg" hint-placeholder-count="2">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-700);width:96px;flex:none">{{ cg.label }}</span>
        <div class="cf-rail" style="display:flex;gap:6px;min-width:0;flex:1 1 0;padding:2px 0">
          <sc-for list="{{ cg.items }}" as="c" hint-placeholder-count="5"><button onClick="{{ c.pick }}" style="font:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;padding:6px 12px;min-height:34px;border-radius:999px;border:1.5px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};cursor:pointer;flex:none">{{ c.label }}</button></sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0">
      <span style="font-size:12px;color:var(--color-neutral-700);font-weight:700">{{ title }}</span>
      <span style="font-weight:800;font-size:30px;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1">{{ val }}<span style="font-size:15px;font-weight:700;color:var(--color-neutral-700);margin-left:4px">{{ unit }}</span></span>
    </div>
    <sc-if value="{{ hasDelta }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span style="font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;background:{{ soft }};color:{{ ink }};font-variant-numeric:tabular-nums">{{ delta }}</span><span style="font-size:11px;color:var(--color-neutral-700)">{{ deltaSub }}</span></div></sc-if>
  </div>

  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><p style="margin:0;padding:24px 12px;border-radius:16px;background:var(--color-neutral-100);font-size:13px;color:var(--color-neutral-700);text-align:center;text-wrap:pretty">{{ emptyText }}</p></sc-if>

  <sc-if value="{{ showLine }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 40px;column-gap:6px">
      <div style="position:relative;height:200px;min-width:0">
      <svg viewBox="0 0 320 150" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible">
        <path d="M0 12H320M0 71H320M0 130H320" stroke="#e8eef4" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"></path>
        <path d="{{ area }}" fill="{{ soft }}" fill-opacity=".75"></path>
        <path d="{{ line }}" fill="none" stroke="{{ solid }}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
      </svg>
      <sc-for list="{{ dots }}" as="p" hint-placeholder-count="0"><span title="{{ p.tip }}" style="position:absolute;left:{{ p.l }};top:{{ p.t }};width:{{ p.sz }};height:{{ p.sz }};transform:translate(-50%,-50%);border-radius:50%;background:{{ p.bg }};border:{{ p.bd }};box-sizing:border-box;box-shadow:0 1px 3px rgba(20,50,80,.18)"></span></sc-for>
      </div>
      <div style="position:relative;font-size:10px;color:var(--color-neutral-600);font-variant-numeric:tabular-nums"><span style="position:absolute;top:8%;transform:translateY(-50%)">{{ yHi }}</span><span style="position:absolute;top:47%;transform:translateY(-50%)">{{ yMid }}</span><span style="position:absolute;top:86.7%;transform:translateY(-50%)">{{ yLo }}</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--color-neutral-700);margin:-6px 46px 0 0"><span>{{ x0 }}</span><span>{{ nPts }}</span><span>{{ x1 }}</span></div>
  </sc-if>

  <sc-if value="{{ showBars }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative;height:150px;display:flex;align-items:flex-end;gap:{{ barGap }};border-bottom:1px solid var(--color-divider)">
      <sc-if value="{{ hasTarget }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0;right:0;bottom:{{ target }};border-top:2px dashed #1180c2;pointer-events:none;z-index:1"><span style="position:absolute;right:0;top:-18px;font-size:10px;font-weight:800;color:#0e6fa9;background:#fff;padding:0 4px">{{ targetLabel }}</span></div></sc-if>
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="14"><div title="{{ b.tip }}" style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0"><div style="width:100%;max-width:24px;height:{{ b.h }};min-height:{{ b.minH }};background:{{ b.bg }};border-radius:6px 6px 2px 2px"></div></div></sc-for>
    </div>
    <div style="display:flex;gap:{{ barGap }};margin-top:-8px"><sc-for list="{{ bars }}" as="b" hint-placeholder-count="14"><span style="flex:1;text-align:center;font-size:10px;color:var(--color-neutral-700);font-weight:{{ b.fw }};min-width:0;overflow:hidden;white-space:nowrap">{{ b.lbl }}</span></sc-for></div>
  </sc-if>

  <sc-if value="{{ hasLegend }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--color-neutral-700)"><sc-for list="{{ legend }}" as="g" hint-placeholder-count="3"><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:{{ g.r }};background:{{ g.c }}"></span>{{ g.l }}</span></sc-for></div></sc-if>

</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;420px&quot;,&quot;height&quot;:&quot;420px&quot;},&quot;logs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;metrics&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;array&quot;},&quot;perNames&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;array&quot;},&quot;tk&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1850,&quot;tsType&quot;:&quot;number&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;coral&quot;,&quot;blue&quot;],&quot;default&quot;:&quot;coral&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;head&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headSub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;storeKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;cf-seg&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const pad2=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parseD=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoD(d);};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;};
const R=Math.round,fx=(x,d)=>Number(x).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const dShort=s=>parseD(s).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const SCALE=['#e5604a','#f29b62','#efc95e','#9bd08a','#2f9e62'];
const SQ={sat:['Satisfacción',false],hambre:['Hambre',true],energia:['Energía',false]};
const TONES={coral:['#963a2b','#e0806e','#fde8e3'],blue:['#0e6fa9','#1180c2','#e3f1fa']};
function dayScore(L,Tk){if(!L)return null;const F=L.foods||[],S=L.survey||{};let a=null,b=null;
  if(F.length&&Tk){const k=F.reduce((s,x)=>s+num(x.k),0),dev=Math.abs(k/Tk-1);a=Math.max(0,Math.min(100,100-Math.max(0,dev-0.1)/0.3*100));}
  if(S.cump)b=(S.cump-1)/4*100;if(a==null&&b==null)return null;return a==null?b:b==null?a:(a+b)/2;}
const band=p=>p>=80?'#2f9e62':p>=60?'#efc95e':'#e5604a';
class Component extends DCLogic {
  state={metric:null,range:null};
  renderVals(){
    const p=this.props,s=this.state,lg=p.logs||{},ms=(p.metrics||[]).slice().sort((a,b)=>a.d<b.d?-1:1),PN=p.perNames||[],Tk=num(p.tk),today=isoD(new Date());
    const T=TONES[p.tone]||TONES.coral,[ink,solid,soft]=T;
    const key0=p.storeKey||'cf-seg';let saved={};try{saved=JSON.parse(localStorage.getItem(key0)||'{}');}catch(e){}
    const defs=[['cump','Cumplimiento','bars'],['kcal','Kcal','bars'],['peso','Peso','line'],['sat','Satisfacción','bars'],['hambre','Hambre','bars'],['energia','Energía','bars']];
    if(ms.some(m=>m.bf!=null))defs.push(['bf','% Grasa','line']);if(ms.some(m=>m.lbm!=null))defs.push(['lbm','Masa magra','line']);if(ms.some(m=>m.mm!=null))defs.push(['mm','Masa muscular','line']);
    if(ms.some(m=>m.s6!=null))defs.push(['s6','Σ6 pliegues','line']);
    (p.plNames||[]).forEach(([k,l])=>{if(ms.some(m=>m.pl&&num(m.pl[k])>0))defs.push(['pl:'+k,l,'line']);});
    PN.forEach(([k,l])=>{if(ms.some(m=>m.per&&m.per[k]))defs.push(['per:'+k,l,'line']);});
    const metric=s.metric||saved.m,cur=defs.find(d=>d[0]===metric)||defs[0],range=s.range||saved.r||'30';
    const save=o=>{try{localStorage.setItem(key0,JSON.stringify({m:cur[0],r:range,...o}));}catch(e){}};
    const v={ink,solid,soft,hasHead:!!p.head,head:p.head||'',headSub:p.headSub||'',hasDelta:false,showLine:false,showBars:false,empty:false,hasTarget:false,hasLegend:false};
    const dayK=['cump','kcal','sat','hambre','energia'],mk=([k,l])=>({label:l,pick:()=>{save({m:k});this.setState({metric:k});},bg:k===cur[0]?ink:'#fff',fg:k===cur[0]?'#fff':ink,bd:k===cur[0]?ink:soft});
    const isPl=d=>d[0].startsWith('pl:'),isPer=d=>d[0].startsWith('per:');
    v.chipGroups=[['Día a día',defs.filter(d=>dayK.includes(d[0]))],['Cuerpo',defs.filter(d=>!dayK.includes(d[0])&&!isPl(d)&&!isPer(d))],['Pliegues',defs.filter(isPl)],['Perímetros',defs.filter(isPer)]].filter(g=>g[1].length).map(([label,ds])=>({label,items:ds.map(mk)}));
    v.ranges=[['14','2 sem.'],['30','1 mes'],['91','3 meses'],['all','Todo']].map(([r,l])=>({label:l,bg:range===r?'#fff':'transparent',fg:range===r?'var(--color-text)':'var(--color-neutral-700)',pick:()=>{save({r});this.setState({range:r});}}));
    const allDays=Object.keys(lg).sort(),first=allDays[0]||today;
    const nDays=range==='all'?Math.max(14,Math.min(730,R((parseD(today)-parseD(first))/86400000)+1)):num(range),from=addDays(today,-(nDays-1));
    if(cur[2]==='bars'){v.showBars=true;const k=cur[0];
      const val=d=>{const L=lg[d];if(!L)return null;if(k==='cump')return dayScore(L,Tk);if(k==='kcal'){const F=L.foods||[];return F.length?F.reduce((a,x)=>a+num(x.k),0):null;}const q=L.survey&&L.survey[k];return q?num(q):null;};
      let dayList=[];for(let i=nDays-1;i>=0;i--)dayList.push(addDays(today,-i));
      let items=dayList.map(d=>({d,v:val(d),lbl:String(parseD(d).getDate())}));
      if(nDays>31){const wk=[];for(let i=0;i<items.length;i+=7){const ch=items.slice(i,i+7),g=ch.filter(x=>x.v!=null);wk.push({d:ch[0].d,v:g.length?g.reduce((a,x)=>a+x.v,0)/g.length:null,lbl:dShort(ch[0].d).split(' ')[0]+'/'+(parseD(ch[0].d).getMonth()+1),wk:true});}items=wk;}
      const got=items.filter(x=>x.v!=null),avg=got.length?got.reduce((a,x)=>a+x.v,0)/got.length:null;
      v.barGap=items.length>40?'1px':items.length>20?'2px':'4px';
      const step=Math.ceil(items.length/10);
      const color=x=>{if(k==='cump')return band(x);if(k==='kcal'){const dev=Math.abs(x/Tk-1);return dev<=0.1?'#2f9e62':dev<=0.2?'#efc95e':'#e5604a';}const i=Math.max(1,Math.min(5,R(x)))-1;return SCALE[SQ[k][1]?4-i:i];};
      let mx=100;if(k==='kcal')mx=Math.max(Tk*1.35,...got.map(x=>x.v),1);else if(k!=='cump')mx=5;
      v.bars=items.map((x,i)=>({h:(x.v==null?0:Math.max(3,x.v/mx*100))+'%',minH:x.v==null?'4px':'0',bg:x.v==null?'#e8eef4':color(x.v),fw:x.d===today?'800':'500',lbl:i%step===0||i===items.length-1?x.lbl:'',
        tip:(x.wk?'Semana del '+dShort(x.d):dShort(x.d))+': '+(x.v==null?'sin datos':k==='cump'?R(x.v)+' %':k==='kcal'?R(x.v)+' kcal':fx(x.v,1)+' / 5')}));
      v.title=(k==='cump'?'Cumplimiento medio':k==='kcal'?'Media diaria registrada':SQ[k][0]+' media (1 a 5)')+(nDays>31?' · medias semanales':'');
      v.val=avg==null?'—':k==='cump'?String(R(avg)):k==='kcal'?R(avg).toLocaleString('es-ES'):fx(avg,1);v.unit=k==='cump'?'%':k==='kcal'?'kcal':'/ 5';
      if(k==='kcal'&&Tk){v.hasTarget=true;v.target=(Tk/mx*100)+'%';v.targetLabel='Objetivo '+R(Tk).toLocaleString('es-ES');}
      v.hasLegend=true;v.legend=k==='cump'?[{c:'#2f9e62',l:'80 % o más'},{c:'#efc95e',l:'60–79 %'},{c:'#e5604a',l:'Menos de 60 %'},{c:'#e8eef4',l:'Sin registro'}].map(g=>({...g,r:'3px'})):k==='kcal'?[{c:'#2f9e62',l:'±10 % del objetivo'},{c:'#efc95e',l:'±20 %'},{c:'#e5604a',l:'Más desviado'}].map(g=>({...g,r:'3px'})):[{c:SQ[k][1]?SCALE[0]:SCALE[4],l:SQ[k][1]?'5 = mucha hambre':'5 = muy bien'},{c:SQ[k][1]?SCALE[4]:SCALE[0],l:SQ[k][1]?'1 = nada de hambre':'1 = muy mal'}].map(g=>({...g,r:'3px'}));
      if(!got.length){v.showBars=false;v.hasLegend=false;v.empty=true;v.emptyText=k==='kcal'?'Sin comidas registradas en este periodo.':'Sin respuestas en este periodo. Se rellenan desde el cuestionario diario de la app.';}}
    else{const k=cur[0],unit=k==='bf'?'%':k.startsWith('per:')?'cm':(k==='s6'||k.startsWith('pl:'))?'mm':'kg';
      let pts;
      if(k==='peso'){const m={};Object.keys(lg).forEach(d=>{const w=lg[d]&&lg[d].survey&&num(lg[d].survey.peso);if(w)m[d]={y:w,big:false};});ms.forEach(x=>{if(x.w)m[x.d]={y:num(x.w),big:true};});pts=Object.keys(m).sort().map(d=>({d,...m[d]}));}
      else pts=ms.map(x=>({d:x.d,y:k==='bf'?x.bf:k==='lbm'?x.lbm:k==='mm'?x.mm:k==='s6'?x.s6:k.startsWith('pl:')?num((x.pl||{})[k.slice(3)]):(x.per||{})[k.slice(4)],big:true})).filter(q=>q.y!=null&&q.y>0);
      if(range!=='all')pts=pts.filter(q=>q.d>=from);
      v.title=cur[1]+(k==='peso'?' · cuestionario diario y mediciones':' · mediciones en consulta');v.unit=unit;
      v.val=pts.length?fx(pts[pts.length-1].y,1):'—';
      if(k==='peso'){v.hasLegend=true;v.legend=[{c:solid,l:'Peso del cuestionario',r:'50%'},{c:ink,l:'Medición en consulta',r:'50%'}];}
      if(pts.length<2){v.empty=true;v.emptyText=pts.length===1?'Solo hay un dato en este periodo; con dos o más se ve la evolución. Prueba con «Todo».':k==='peso'?'Sin pesos en este periodo. Se apuntan en el cuestionario diario o en las mediciones.':'Sin mediciones en este periodo.';}
      else{v.showLine=true;const t0=parseD(pts[0].d).getTime(),t1=parseD(pts[pts.length-1].d).getTime(),ys=pts.map(q=>q.y);let lo=Math.min(...ys),hi=Math.max(...ys);const pd=Math.max((hi-lo)*0.15,0.4);lo-=pd;hi+=pd;
        const X=q=>6+(t1===t0?154:(parseD(q.d).getTime()-t0)/(t1-t0)*308),Y=y=>12+(1-(y-lo)/(hi-lo))*118;
        const xy=pts.map(q=>[X(q).toFixed(1),Y(q.y).toFixed(1),q.big]);
        v.line='M'+xy.map(q=>q[0]+' '+q[1]).join(' L');v.area=v.line+' L'+xy[xy.length-1][0]+' 130 L'+xy[0][0]+' 130 Z';
        v.dots=xy.map((q,i)=>({q,i})).filter(o=>o.q[2]||pts.length<=60).map(({q,i})=>{const big=q[2];return {l:(q[0]/320*100).toFixed(2)+'%',t:(q[1]/150*100).toFixed(2)+'%',sz:big?'13px':'8px',bg:big?'#fff':solid,bd:big?'3px solid '+ink:'0',tip:dShort(pts[i].d)+' · '+fx(pts[i].y,1)+' '+unit};});
        v.yHi=fx(hi,1);v.yLo=fx(lo,1);v.yMid=fx((hi+lo)/2,1);v.x0=dShort(pts[0].d);v.x1=dShort(pts[pts.length-1].d);v.nPts=pts.length+' datos';
        const dl=pts[pts.length-1].y-pts[0].y;v.hasDelta=true;v.delta=(dl>0?'+':dl<0?'−':'')+fx(Math.abs(dl),1)+' '+unit;v.deltaSub='desde el '+dShort(pts[0].d);}}
    return v;
  }
}
</script>
</body>
</html>
